name: CI

# Keep `ZIG_VERSION` in step with the Pages and release workflows and the local
# toolchain; the setup-zig mirror purges old nightlies, so a stale pin fails.

on:
  push:
    branches: [main]
  pull_request:

env:
  ZIG_VERSION: 0.17.0-dev.1786+75044cb04

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - run: zig fmt --check src bench examples build.zig
      - run: zig build test
      - run: zig build check

  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - run: zig build cross

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - run: zig build docs
